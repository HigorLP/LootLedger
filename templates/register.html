<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Terminal | Registrar</title><script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 bg-gray-900 z-0"></div>
    <div class="bg-gray-800 p-10 rounded-2xl border border-gray-700 shadow-2xl z-10 w-full max-w-md">
        <div class="text-center mb-8"><h1 class="text-3xl font-black text-blue-400 tracking-tight">Novo Acesso</h1></div>
        {% if erro %}<div class="bg-red-900/50 border border-red-500 text-red-400 text-xs text-center p-3 rounded mb-6 font-bold">{{ erro }}</div>{% endif %}
        <form action="/register" method="POST" class="space-y-5">
            <div><label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1 font-bold">Usuário</label><input type="text" name="username" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition"></div>
            <div><label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1 font-bold">Senha</label><input type="password" name="password" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition"></div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg uppercase tracking-widest text-sm transition mt-4">Criar Conta Segura</button>
        </form>
        <p class="text-center text-xs text-gray-500 mt-6"><a href="/login" class="text-gray-400 hover:text-white underline">Voltar para o Login</a></p>
    </div>
</body>
</html>
