{% extends "base.html" %}

{% block content %}
<div class="flex items-center gap-3 mb-6">
    <span class="text-3xl">🎲</span><h2 class="text-2xl font-bold text-white tracking-wide">Registro de Sessões (Caixas/Bets)</h2>
</div>

<div class="bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-2xl max-w-5xl relative overflow-hidden">
    <div class="absolute top-0 right-0 bg-yellow-600 text-white text-[10px] font-bold px-3 py-1 uppercase tracking-widest rounded-bl-lg shadow">Diluição de Risco Proporcional</div>
    
    <form action="/process_session" method="POST" id="sessionForm">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 bg-gray-900 p-6 rounded-xl border border-gray-700 shadow-inner">
            <div>
                <label class="block text-xs text-gray-400 uppercase tracking-widest font-bold mb-2">Site Hospedeiro</label>
                <select name="plataforma" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-600 transition">
                    {% for s in sites_bets %}<option value="{{ s.nome }}">{{ s.nome }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs text-yellow-500 uppercase tracking-widest font-bold mb-2">Depósito Gasto (USD)</label>
                <input type="number" step="0.01" name="deposito_usd" id="dep_usd" required placeholder="0.00" class="w-full bg-gray-800 border-2 border-yellow-600 rounded-lg p-3 text-white font-bold text-lg focus:outline-none shadow-lg">
            </div>
            <div>
                <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-2">Calculadora Câmbio (Opcional BRL)</label>
                <div class="flex gap-2">
                    <input type="number" step="0.01" id="dep_brl" placeholder="R$ pago" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
                    <button type="button" onclick="converterMoeda()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-lg font-bold transition text-xs uppercase tracking-widest shadow">Conv.</button>
                </div>
            </div>
        </div>

        <div class="mb-6 flex justify-between items-end border-b border-gray-700 pb-4">
            <div>
                <h3 class="text-xl font-bold text-white">Skins Resgatadas</h3>
                <p class="text-xs text-gray-500 mt-1">Insira o valor de mercado. O custo do depósito será rateado pelo peso de cada item.</p>
            </div>
            <button type="button" onclick="addItemRow()" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2.5 rounded-lg text-xs font-bold uppercase tracking-widest transition shadow-lg flex items-center gap-2"><span class="text-lg">+</span> Nova Linha</button>
        </div>

        <div id="items-container" class="space-y-4 mb-8">
            <div class="flex gap-4 items-center item-row bg-gray-900 p-3 rounded-lg border border-gray-700 shadow-sm relative group">
                <div class="flex-1">
                    <label class="block text-[9px] text-gray-500 uppercase font-bold mb-1">Nome Base Exato (API)</label>
                    <input type="text" name="item_nome[]" placeholder="Ex: Glock-18 | Fade" required class="w-full bg-gray-800 border border-gray-600 rounded p-2.5 text-white text-sm focus:outline-none focus:border-yellow-600">
                </div>
                <div class="w-32">
                    <label class="block text-[9px] text-gray-500 uppercase font-bold mb-1">Preço Mercado ($)</label>
                    <input type="number" step="0.01" name="item_mercado[]" placeholder="0.00" required class="w-full bg-gray-800 border border-gray-600 rounded p-2.5 text-white text-sm font-bold focus:outline-none focus:border-yellow-600 text-center">
                </div>
                <div class="w-40">
                    <label class="block text-[9px] text-gray-500 uppercase font-bold mb-1">Pasta</label>
                    <select name="item_cat[]" class="w-full bg-gray-800 border border-gray-600 rounded p-2.5 text-gray-300 text-xs focus:outline-none">
                        {% for c in db_categorias %}<option value="{{ c.nome }}">{{ c.nome }}</option>{% endfor %}
                    </select>
                </div>
                <button type="button" onclick="removeItemRow(this)" class="mt-4 text-red-500 bg-red-900/20 hover:bg-red-600 hover:text-white px-3 py-2 rounded text-xs font-bold transition shadow-sm" title="Remover item">X</button>
            </div>
        </div>

        <div class="flex justify-end pt-6 border-t border-gray-700">
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-10 rounded-xl shadow-xl uppercase tracking-widest transition flex items-center gap-2">
                <span>✅</span> Processar Rateio e Salvar
            </button>
        </div>
    </form>
</div>
<script>
    function addItemRow() { let c = document.getElementById('items-container'); let r = c.querySelector('.item-row').cloneNode(true); r.querySelectorAll('input').forEach(i => i.value = ''); c.appendChild(r); }
    function removeItemRow(btn) { let c = document.getElementById('items-container'); if(c.children.length > 1) { btn.closest('.item-row').remove(); } else { alert("A sessão não pode ficar vazia."); } }
    function converterMoeda() { let b = parseFloat(document.getElementById('dep_brl').value); if(b>0){ document.getElementById('dep_usd').value = (b/5.15).toFixed(2); } }
    if(new URLSearchParams(window.location.search).get('success')) { alert('🎲 Sucesso! Os itens foram diluídos e enviados para as pastas selecionadas.'); window.history.replaceState(null, null, window.location.pathname); }
</script>
{% endblock %}
